<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 96" role="img" aria-labelledby="title desc">
  <title id="title">The Kisalan Experience logo</title>
  <desc id="desc">KIS ISMS mark with The Kisalan Experience, established 1969.</desc>
  <g fill="none" stroke="#fff" stroke-linecap="square" stroke-linejoin="miter">
    <rect x="4" y="8" width="72" height="72" stroke-width="2.4"/>
    <rect x="9.5" y="13.5" width="61" height="61" stroke-width="1" opacity=".55"/>
  </g>
  <g fill="#fff" font-family="Impact, 'Arial Black', sans-serif" text-anchor="middle">
    <text x="40" y="38" font-size="27" letter-spacing="5">KIS</text>
    <text x="40" y="65" font-size="27" letter-spacing="1.8">ISMS</text>
  </g>
  <g transform="translate(98 23)">
    <rect x="0" y="0" width="248" height="32" fill="none" stroke="#fff" stroke-width="2.2"/>
    <text x="17" y="22" fill="#fff" font-family="'Arial Narrow', 'Segoe UI Condensed', 'Arial Black', sans-serif" font-size="15" font-weight="800" letter-spacing=".8">THE KISALAN EXPERIENCE</text>
    <path d="M0 42h196" stroke="#fff" stroke-width="5"/>
    <text x="204" y="47" fill="#fff" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic">est. 1969</text>
  </g>
</svg>
